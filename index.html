<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Kücheninventar</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      text-align: center;
    }

    #reader {
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    #produktBox {
      display: none;
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 15px;
    }

    #produktName {
      font-size: 24px;
      font-weight: bold;
    }

    #bestand {
      font-size: 32px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 17px;
      margin-top: 10px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .plus {
      background: #d9ead3;
    }

    .minus {
      background: #f4cccc;
    }

    #meldung {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      white-space: pre-line;
    }
  </style>
</head>

<body>

<h1>🥫 Kücheninventar</h1>

<div id="reader"></div>

<div id="produktBox">

  <div id="produktName"></div>

  <p id="details"></p>

  <p>
    Bestand:
    <span id="bestand">0</span>
  </p>

  <button class="plus" onclick="buchen('plus')">
    ➕ 1 Einlagern
  </button>

  <button class="minus" onclick="buchen('minus')">
    ➖ 1 Entnehmen
  </button>

</div>

<div id="meldung"></div>


<script>

  // DEINE APPS-SCRIPT-WEB-APP-URL:
  const API_URL =
    "https://script.google.com/macros/s/AKfycbyuxJgOWFwuNFlNAHELJvqEg55Y8uHMM99_AQUi5n8QxP5aDCgDbqqURIgwSueDjbgI/exec";


  let aktuellerBarcode = "";
  let letzterScan = "";
  let letzterScanZeitpunkt = 0;


  // ----------------------------
  // JSONP
  // ----------------------------

  function jsonp(parameter, callback) {

    const callbackName =
      "jsonpCallback_" + Date.now();

    window[callbackName] = function(daten) {

      callback(daten);

      delete window[callbackName];

      script.remove();
    };


    const script =
      document.createElement("script");

    script.src =
      API_URL +
      "?" +
      parameter +
      "&callback=" +
      callbackName;

    script.onerror = function() {

      document.getElementById("meldung")
        .innerText =
        "❌ Verbindung zum Inventar fehlgeschlagen.";

      delete window[callbackName];

      script.remove();
    };


    document.body.appendChild(script);
  }


  // ----------------------------
  // BARCODE GEFUNDEN
  // ----------------------------

  function barcodeGefunden(decodedText) {

    const jetzt = Date.now();

    if (
      decodedText === letzterScan &&
      jetzt - letzterScanZeitpunkt < 3000
    ) {
      return;
    }


    letzterScan = decodedText;
    letzterScanZeitpunkt = jetzt;

    aktuellerBarcode = decodedText;


    document.getElementById("meldung")
      .innerText =
      "🔎 Produkt wird gesucht …";


    jsonp(
      "action=produkt&barcode=" +
      encodeURIComponent(decodedText),

      function(daten) {

        if (daten.gefunden) {

          document.getElementById("produktBox")
            .style.display = "block";


          document.getElementById("produktName")
            .innerText =
            daten.produkt;


          document.getElementById("details")
            .innerText =
            (daten.marke || "") +
            "\n📦 " +
            (daten.kategorie || "") +
            "\n📍 " +
            (daten.standort || "");


          document.getElementById("bestand")
            .innerText =
            daten.bestand;


          document.getElementById("meldung")
            .innerText =
            "✅ Produkt erkannt";

        } else {

          document.getElementById("produktBox")
            .style.display =
            "none";


          document.getElementById("meldung")
            .innerText =
            "❓ Produkt unbekannt\nBarcode: " +
            decodedText;
        }
      }
    );
  }


  // ----------------------------
  // EINLAGERN / ENTNEHMEN
  // ----------------------------

  function buchen(typ) {

    if (!aktuellerBarcode) {
      return;
    }


    document.getElementById("meldung")
      .innerText =
      "⏳ Wird gespeichert …";


    jsonp(
      "action=buchen" +
      "&barcode=" +
      encodeURIComponent(aktuellerBarcode) +
      "&typ=" +
      encodeURIComponent(typ),

      function(daten) {

        if (daten.erfolg) {

          document.getElementById("bestand")
            .innerText =
            daten.bestand;


          if (typ === "plus") {

            document.getElementById("meldung")
              .innerText =
              "✅ 1 eingelagert";

          } else {

            document.getElementById("meldung")
              .innerText =
              "✅ 1 entnommen";

          }

        } else {

          document.getElementById("meldung")
            .innerText =
            "❌ " +
            (daten.fehler || "Fehler");

        }
      }
    );
  }


  // ----------------------------
  // SCANNER STARTEN
  // ----------------------------

  const scanner =
    new Html5QrcodeScanner(

      "reader",

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 140
        },

        rememberLastUsedCamera: true
      },

      false
    );


  scanner.render(barcodeGefunden);

</script>

</body>
</html>
