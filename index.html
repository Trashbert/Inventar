<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kücheninventar</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial, sans-serif;
  max-width: 500px;
  margin: auto;
  padding: 18px;
  background: #f4f4f4;
}

h1 {
  text-align: center;
}

#reader {
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

.box {
  background: white;
  padding: 20px;
  margin-top: 18px;
  border-radius: 15px;
}

#produktBox,
#neuBox {
  display: none;
}

#produktName {
  font-size: 24px;
  font-weight: bold;
}

.bestand {
  font-size: 20px;
}

#bestand {
  font-size: 34px;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 17px;
  margin-top: 10px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
}

.plus {
  background: #d9ead3;
}

.minus {
  background: #f4cccc;
}

.speichern {
  background: #cfe2f3;
}

input,
select {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin-top: 5px;
  margin-bottom: 12px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 9px;
  background: white;
}

label {
  font-weight: bold;
}

#meldung {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
  white-space: pre-line;
}

.navigation {
  display: flex;
  gap: 6px;
  margin-bottom: 15px;
  position: sticky;
  top: 0;
  background: #f4f4f4;
  padding: 8px 0;
  z-index: 100;
}

.navigation button {
  flex: 1;
  padding: 12px 5px;
  margin: 0;
  font-size: 15px;
}  

.bestandsButtons {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.bestandsButtons button {
  flex: 1;
  margin: 0;
  padding: 10px;
  font-size: 20px;
}
  
</style>

</head>


<body>


<h1>🥫 Kücheninventar</h1>
<div class="navigation">

  <button onclick="zeigeBereich('scanner')">
    📷 Scanner
  </button>

  <button onclick="zeigeBereich('bestand')">
    📦 Bestand
  </button>

  <button onclick="zeigeBereich('einkauf')">
    🛒 Einkauf
  </button>

  <button onclick="zeigeBereich('mhd')">
  ⏰ MHD
</button>

</div>

<div id="bereichScanner">  
<div id="reader"></div>


<div id="produktBox" class="box">

  <div id="produktName"></div>

  <p id="details"></p>

  <p class="bestand">
    Bestand:
    <span id="bestand">0</span>
  </p>

  <label for="mhdScan">MHD (optional)</label>

<input
  id="mhdScan"
  type="date">

  <button
    class="plus"
    onclick="buchen('plus')">
    ➕ 1 Einlagern
  </button>

  <button
    class="minus"
    onclick="buchen('minus')">
    ➖ 1 Entnehmen
  </button>

</div>


<div id="neuBox" class="box">

  <h2>Neues Produkt</h2>

  <p>
    Barcode:
    <strong id="neuerBarcode"></strong>
  </p>


  <label>Produktname</label>

  <input
    id="neuProdukt"
    type="text"
    placeholder="z. B. Gehackte Tomaten">


  <label>Marke</label>

  <input
    id="neuMarke"
    type="text"
    placeholder="optional">


  <label>Kategorie</label>

  <select id="neuKategorie">

    <option>Konserven</option>
    <option>Soßen</option>
    <option>Gläser</option>
    <option>Nudeln & Reis</option>
    <option>Backen</option>
    <option>Gewürze</option>
    <option>Getränke</option>
    <option>Sonstiges</option>

  </select>


  <label>Einheit</label>

  <select id="neuEinheit">

    <option>Stück</option>
    <option>Dose</option>
    <option>Glas</option>
    <option>Flasche</option>
    <option>Packung</option>

  </select>


  <label>Standort</label>

  <select id="neuStandort">

    <option>Vorratsschrank</option>
    <option>Kühlschrank</option>
    <option>Gefrierschrank</option>
    <option>Regal</option>
    <option>Keller</option>
    <option>Sonstiges</option>

  </select>


  <label>Mindestbestand</label>

  <input
    id="neuMindestbestand"
    type="number"
    value="1"
    min="0">


  <button
    class="speichern"
    onclick="produktSpeichern()">

    💾 Speichern & +1 einlagern

  </button>

</div>


<div id="meldung"></div>
</div>

<div id="bereichBestand" style="display:none;">  
<div class="box">

  <h2>📦 Mein Bestand</h2>

  <input
  id="bestandSuche"
  type="search"
  placeholder="🔎 Produkt suchen …"
  oninput="bestandFiltern()">

  <div id="bestandsListe"></div>

</div>
</div>

<div id="bearbeitenBox" class="box" style="display:none;">

  <h2>✏️ Produkt bearbeiten</h2>

  <input id="editBarcode" type="hidden">

  <label>Produktname</label>
  <input id="editProdukt" type="text">

  <label>Marke</label>
  <input id="editMarke" type="text">

  <label>Kategorie</label>
  <select id="editKategorie">
    <option>Konserven</option>
    <option>Soßen</option>
    <option>Gläser</option>
    <option>Nudeln & Reis</option>
    <option>Backen</option>
    <option>Gewürze</option>
    <option>Getränke</option>
    <option>Sonstiges</option>
  </select>

  <label>Einheit</label>
  <select id="editEinheit">
    <option>Stück</option>
    <option>Dose</option>
    <option>Glas</option>
    <option>Flasche</option>
    <option>Packung</option>
  </select>

  <label>Standort</label>
  <select id="editStandort">
    <option>Vorratsschrank</option>
    <option>Kühlschrank</option>
    <option>Gefrierschrank</option>
    <option>Regal</option>
    <option>Keller</option>
    <option>Sonstiges</option>
  </select>

  <label>Mindestbestand</label>
  <input id="editMindestbestand" type="number" min="0">

  <button class="speichern" onclick="produktAenderungSpeichern()">
    💾 Änderungen speichern
  </button>

  <button onclick="bearbeitenAbbrechen()">
    Abbrechen
  </button>

</div>  

<div id="bereichEinkauf" style="display:none;">
<div class="box">

  <h2>🛒 Einkaufsliste</h2>

  

  <div id="einkaufsListe"></div>

</div>
</div>

<div id="bereichMhd" style="display:none;">

  <div class="box">

    <h2>⏰ Haltbarkeit</h2>

    <div id="mhdListe"></div>

  </div>

</div>  

<script>


// ========================================
// HIER DEINE APPS-SCRIPT-URL EINTRAGEN
// ========================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyuxJgOWFwuNFlNAHELJvqEg55Y8uHMM99_AQUi5n8QxP5aDCgDbqqURIgwSueDjbgI/exec";


// ========================================


let aktuellerBarcode = "";

let letzterScan = "";

let letzterScanZeitpunkt = 0;

let buchungLaeuft = false;

let aktuelleBestandsListe = [];



// ---------- JSONP ----------

function jsonp(parameter, callback) {

  const callbackName =
    "cb_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);


  const script =
    document.createElement("script");


  window[callbackName] =
    function(daten) {

      callback(daten);

      delete window[callbackName];

      script.remove();
    };


  script.src =
    API_URL +
    "?" +
    parameter +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      document.getElementById("meldung")
        .innerText =
        "❌ Verbindung zum Inventar fehlgeschlagen.";

      delete window[callbackName];

      script.remove();
    };


  document.body.appendChild(script);
}



// ---------- SCAN ----------

function barcodeGefunden(decodedText) {

  const jetzt = Date.now();


  if (
    decodedText === letzterScan &&
    jetzt - letzterScanZeitpunkt < 3000
  ) {
    return;
  }


  letzterScan = decodedText;

  letzterScanZeitpunkt = jetzt;

  aktuellerBarcode = decodedText;


  document.getElementById("produktBox")
    .style.display = "none";

  document.getElementById("neuBox")
    .style.display = "none";


  document.getElementById("meldung")
    .innerText =
    "🔎 Produkt wird gesucht …";


  jsonp(

    "action=produkt&barcode=" +
    encodeURIComponent(decodedText),

    produktAnzeigen

  );

}



// ---------- PRODUKT ANZEIGEN ----------

function produktAnzeigen(daten) {

  if (daten.gefunden) {

    document.getElementById("neuBox")
      .style.display = "none";


    document.getElementById("produktBox")
      .style.display = "block";


    document.getElementById("produktName")
      .innerText =
      daten.produkt;


    document.getElementById("details")
      .innerText =
      (daten.marke || "") +
      "\n📦 " +
      (daten.kategorie || "") +
      "\n📍 " +
      (daten.standort || "");


    document.getElementById("bestand")
      .innerText =
      daten.bestand;


    document.getElementById("meldung")
      .innerText =
      "✅ Produkt erkannt";


  } else {


    document.getElementById("produktBox")
      .style.display = "none";


    document.getElementById("neuBox")
      .style.display = "block";


    document.getElementById("neuerBarcode")
      .innerText =
      aktuellerBarcode;


    document.getElementById("neuProdukt")
      .value = "";


    document.getElementById("neuMarke")
      .value = "";


    document.getElementById("meldung")
      .innerText =
      "❓ Dieses Produkt kennen wir noch nicht.";

  }

}



// ---------- BESTAND BUCHEN ----------

function buchen(typ) {

  if (!aktuellerBarcode || buchungLaeuft) {
    return;
  }


  buchungLaeuft = true;


  document.getElementById("meldung")
    .innerText =
    "⏳ Wird gespeichert …";


  jsonp(

    "action=buchen" +
"&barcode=" +
encodeURIComponent(aktuellerBarcode) +
"&typ=" +
encodeURIComponent(typ) +
"&mhd=" +
encodeURIComponent(
  typ === "plus"
    ? document.getElementById("mhdScan").value
    : ""
),

    function(daten) {

      buchungLaeuft = false;


      if (daten.erfolg) {

        document.getElementById("bestand")
          .innerText =
          daten.bestand;


        document.getElementById("meldung")
          .innerText =
          typ === "plus"
          ? "✅ 1 eingelagert"
          : "✅ 1 entnommen";


      } else {

        document.getElementById("meldung")
          .innerText =
          "❌ " +
          (daten.fehler || "Fehler");

      }

    }

  );

}



// ---------- NEUES PRODUKT ----------

function produktSpeichern() {

  const produkt =
    document.getElementById("neuProdukt")
      .value.trim();


  if (!produkt) {

    document.getElementById("meldung")
      .innerText =
      "Bitte einen Produktnamen eingeben.";

    return;
  }


  const marke =
    document.getElementById("neuMarke")
      .value.trim();


  const kategorie =
    document.getElementById("neuKategorie")
      .value;


  const einheit =
    document.getElementById("neuEinheit")
      .value;


  const standort =
    document.getElementById("neuStandort")
      .value;


  const mindestbestand =
    document.getElementById("neuMindestbestand")
      .value;


  document.getElementById("meldung")
    .innerText =
    "⏳ Produkt wird angelegt …";


  jsonp(

    "action=anlegen" +

    "&barcode=" +
    encodeURIComponent(aktuellerBarcode) +

    "&produkt=" +
    encodeURIComponent(produkt) +

    "&marke=" +
    encodeURIComponent(marke) +

    "&kategorie=" +
    encodeURIComponent(kategorie) +

    "&einheit=" +
    encodeURIComponent(einheit) +

    "&standort=" +
    encodeURIComponent(standort) +

    "&mindestbestand=" +
    encodeURIComponent(mindestbestand),


    function(daten) {


      if (daten.erfolg) {

        document.getElementById("neuBox")
          .style.display =
          "none";


        document.getElementById("produktBox")
          .style.display =
          "block";


        document.getElementById("produktName")
          .innerText =
          produkt;


        document.getElementById("details")
          .innerText =
          (marke || "") +
          "\n📦 " +
          kategorie +
          "\n📍 " +
          standort;


        document.getElementById("bestand")
          .innerText =
          daten.bestand;


        document.getElementById("meldung")
          .innerText =
          "✅ Produkt gespeichert und eingelagert";


      } else {


        document.getElementById("meldung")
          .innerText =
          "❌ " +
          (daten.fehler || "Fehler");


      }

    }

  );

}



// ---------- SCANNER ----------

function produktLoeschen(barcode, produktname) {

  const sicher =
    confirm(
      'Produkt "' +
      produktname +
      '" wirklich löschen?\n\n' +
      'Die bisherigen Buchungen bleiben erhalten.'
    );

  if (!sicher) {
    return;
  }


  jsonp(

    "action=loeschen" +
    "&barcode=" +
    encodeURIComponent(barcode),

    function(daten) {

      if (daten.erfolg) {

        alert(
          'Produkt "' +
          produktname +
          '" wurde gelöscht.'
        );

        bestandLaden();

      } else {

        alert(
          daten.fehler ||
          "Produkt konnte nicht gelöscht werden."
        );

      }

    }

  );

}
  
function produktBearbeiten(barcode) {

  const p =
    aktuelleBestandsListe.find(
      x => x.barcode === barcode
    );

  if (!p) {
    return;
  }

  document.getElementById("bereichBestand")
    .style.display = "none";

  document.getElementById("bearbeitenBox")
    .style.display = "block";


  document.getElementById("editBarcode")
    .value = p.barcode;

  document.getElementById("editProdukt")
    .value = p.produkt || "";

  document.getElementById("editMarke")
    .value = p.marke || "";

  document.getElementById("editKategorie")
    .value = p.kategorie || "Sonstiges";

  document.getElementById("editEinheit")
    .value = p.einheit || "Stück";

  document.getElementById("editStandort")
    .value = p.standort || "Vorratsschrank";

  document.getElementById("editMindestbestand")
    .value = p.mindestbestand || 0;
}


function bearbeitenAbbrechen() {

  document.getElementById("bearbeitenBox")
    .style.display = "none";

  document.getElementById("bereichBestand")
    .style.display = "block";
}


function produktAenderungSpeichern() {

  const barcode =
    document.getElementById("editBarcode").value;

  const produkt =
    document.getElementById("editProdukt")
      .value.trim();

  if (!produkt) {
    alert("Bitte Produktname eingeben.");
    return;
  }

  const marke =
    document.getElementById("editMarke").value.trim();

  const kategorie =
    document.getElementById("editKategorie").value;

  const einheit =
    document.getElementById("editEinheit").value;

  const standort =
    document.getElementById("editStandort").value;

  const mindestbestand =
    document.getElementById("editMindestbestand").value;


  jsonp(

    "action=bearbeiten" +
    "&barcode=" + encodeURIComponent(barcode) +
    "&produkt=" + encodeURIComponent(produkt) +
    "&marke=" + encodeURIComponent(marke) +
    "&kategorie=" + encodeURIComponent(kategorie) +
    "&einheit=" + encodeURIComponent(einheit) +
    "&standort=" + encodeURIComponent(standort) +
    "&mindestbestand=" + encodeURIComponent(mindestbestand),

    function(daten) {

      if (daten.erfolg) {

        document.getElementById("bearbeitenBox")
          .style.display = "none";

        document.getElementById("bereichBestand")
          .style.display = "block";

        bestandLaden();

      } else {

        alert(
          daten.fehler ||
          "Änderung konnte nicht gespeichert werden."
        );
      }
    }
  );
}
  
function bestandLaden() {

  const ziel =
    document.getElementById("bestandsListe");

  ziel.innerHTML =
    "<p>⏳ Bestand wird geladen …</p>";

  jsonp(
    "action=bestand",

    function(daten) {

      if (!daten.erfolg) {
        ziel.innerHTML =
          "<p>❌ Bestand konnte nicht geladen werden.</p>";
        return;
      }

      aktuelleBestandsListe = daten.produkte;

      bestandFiltern();
    }
  );
}


function bestandFiltern() {

  const suche =
    document.getElementById("bestandSuche")
      .value
      .toLowerCase()
      .trim();

  const liste =
    aktuelleBestandsListe.filter(p => {

      const text =
        (
          p.produkt + " " +
          (p.marke || "") + " " +
          (p.kategorie || "") + " " +
          (p.standort || "")
        ).toLowerCase();

      return text.includes(suche);
    });

  bestandAnzeigen(liste);
}


function bestandAnzeigen(liste) {

  const ziel =
    document.getElementById("bestandsListe");

  if (liste.length === 0) {
    ziel.innerHTML =
      "<p>Keine passenden Produkte gefunden.</p>";
    return;
  }

  let html = "";

  liste.forEach(p => {

    html += `
      <div style="
        padding:15px 0;
        border-bottom:1px solid #ddd;
      ">

        <strong style="font-size:18px;">
          ${p.produkt}
        </strong>

        ${p.marke
          ? "<br><small>" + p.marke + "</small>"
          : ""
        }

        <br>

        <span>
          📦 Bestand:
          <strong>${p.bestand}</strong>
          ${p.einheit || ""}
        </span>

        <br>

        <small>
          📍 ${p.standort || "–"}
          &nbsp; • &nbsp;
          ${p.kategorie || ""}
        </small>

        <div class="bestandsButtons">

          <button
            class="minus"
            onclick="direktBuchen('${p.barcode}', 'minus')">
            ➖
          </button>

          <button
            class="plus"
            onclick="direktBuchen('${p.barcode}', 'plus')">
            ➕
          </button>

          <button
            onclick="produktBearbeiten('${p.barcode}')">
            ✏️
          </button>

          <button
            onclick="produktLoeschen('${p.barcode}', '${p.produkt.replace(/'/g, "\\'")}')">
            🗑️
          </button>

        </div>

      </div>
    `;
  });

  ziel.innerHTML = html;
}

function direktBuchen(barcode, typ) {

  if (buchungLaeuft) {
    return;
  }

  buchungLaeuft = true;

  jsonp(
    "action=buchen" +
    "&barcode=" +
    encodeURIComponent(barcode) +
    "&typ=" +
    encodeURIComponent(typ),

    function(daten) {

      buchungLaeuft = false;

      if (daten.erfolg) {

        // Bestand danach neu vom Server laden
        bestandLaden();

      } else {

        alert(
          daten.fehler ||
          "Buchung fehlgeschlagen"
        );
      }
    }
  );
}

function einkaufslisteLaden() {

  const ziel =
    document.getElementById("einkaufsListe");

  ziel.innerHTML =
    "<p>⏳ Einkaufsliste wird geladen …</p>";


  jsonp(
    "action=bestand",

    function(daten) {

      if (!daten.erfolg) {

        ziel.innerHTML =
          "<p>❌ Einkaufsliste konnte nicht geladen werden.</p>";

        return;
      }


      const einkaufen =
        daten.produkte.filter(
          p => p.einkaufen
        );


      if (einkaufen.length === 0) {

        ziel.innerHTML =
          "<p>✅ Aktuell musst du nichts nachkaufen.</p>";

        return;
      }


      let html = "";


      einkaufen.forEach(p => {

        const fehlend =
          Math.max(
            1,
            p.mindestbestand - p.bestand + 1
          );


        html += `
          <div style="
            padding:12px 0;
            border-bottom:1px solid #ddd;
          ">

            <strong>
              🛒 ${p.produkt}
            </strong>

            <br>

            Bestand:
            ${p.bestand}

            <br>

            Mindestbestand:
            ${p.mindestbestand}

            <br>

            <strong>
              Empfehlung: ${fehlend} nachkaufen
            </strong>

          </div>
        `;

      });


      ziel.innerHTML = html;

    }
  );
}

function mhdLaden() {

  const ziel =
    document.getElementById("mhdListe");

  ziel.innerHTML =
    "<p>⏳ MHDs werden geladen …</p>";


  jsonp(
    "action=mhd",

    function(daten) {

      if (!daten.erfolg) {

        ziel.innerHTML =
          "<p>❌ MHDs konnten nicht geladen werden.</p>";

        return;
      }


      if (daten.mhd.length === 0) {

        ziel.innerHTML =
          "<p>Keine Produkte mit MHD vorhanden.</p>";

        return;
      }


      const heute = new Date();

      heute.setHours(0, 0, 0, 0);


      // Gleiche Produkte mit gleichem MHD zusammenfassen
const gruppen = {};

daten.mhd.forEach(p => {

  const schluessel =
    p.barcode + "|" + p.mhd;

  if (!gruppen[schluessel]) {

    gruppen[schluessel] = {
      ...p,
      anzahl: 0
    };

  }

  gruppen[schluessel].anzahl++;

});


const gruppierteListe =
  Object.values(gruppen);


// Weiterhin nach frühestem MHD sortieren
gruppierteListe.sort(
  (a, b) =>
    a.mhd.localeCompare(b.mhd)
);


let html = "";


gruppierteListe.forEach(p => {

  const datum =
    new Date(
      p.mhd + "T00:00:00"
    );


  const tage =
    Math.ceil(
      (datum - heute) /
      (1000 * 60 * 60 * 24)
    );


  let symbol;
  let status;


  if (tage < 0) {

    symbol = "🔴";

    status =
      Math.abs(tage) +
      " Tage abgelaufen";

  } else if (tage === 0) {

    symbol = "🔴";
    status = "läuft heute ab";

  } else if (tage <= 30) {

    symbol = "🟡";

    status =
      "noch " +
      tage +
      " Tage";

  } else {

    symbol = "🟢";

    status =
      "noch " +
      tage +
      " Tage";

  }


  const datumDeutsch =
    datum.toLocaleDateString(
      "de-DE"
    );


  html += `

    <div style="
      padding:15px 0;
      border-bottom:1px solid #ddd;
    ">

      <strong style="font-size:18px;">
        ${symbol}
        ${p.produkt}
      </strong>

      ${p.marke
        ? "<br><small>" +
          p.marke +
          "</small>"
        : ""
      }

      <br>

      <strong>
        ${p.anzahl}×
      </strong>

      · MHD:

      <strong>
        ${datumDeutsch}
      </strong>

      <br>

      ${status}

    </div>

  `;

});


ziel.innerHTML = html;

    }
  );
}
