<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kücheninventar</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial, sans-serif;
  max-width: 500px;
  margin: auto;
  padding: 18px;
  background: #f4f4f4;
}

h1 {
  text-align: center;
}

#reader {
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

.box {
  background: white;
  padding: 20px;
  margin-top: 18px;
  border-radius: 15px;
}

#produktBox,
#neuBox {
  display: none;
}

#produktName {
  font-size: 24px;
  font-weight: bold;
}

.bestand {
  font-size: 20px;
}

#bestand {
  font-size: 34px;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 17px;
  margin-top: 10px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
}

.plus {
  background: #d9ead3;
}

.minus {
  background: #f4cccc;
}

.speichern {
  background: #cfe2f3;
}

input,
select {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin-top: 5px;
  margin-bottom: 12px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 9px;
  background: white;
}

label {
  font-weight: bold;
}

#meldung {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
  white-space: pre-line;
}

</style>

</head>


<body>


<h1>🥫 Kücheninventar</h1>


<div id="reader"></div>


<div id="produktBox" class="box">

  <div id="produktName"></div>

  <p id="details"></p>

  <p class="bestand">
    Bestand:
    <span id="bestand">0</span>
  </p>

  <button
    class="plus"
    onclick="buchen('plus')">
    ➕ 1 Einlagern
  </button>

  <button
    class="minus"
    onclick="buchen('minus')">
    ➖ 1 Entnehmen
  </button>

</div>


<div id="neuBox" class="box">

  <h2>Neues Produkt</h2>

  <p>
    Barcode:
    <strong id="neuerBarcode"></strong>
  </p>


  <label>Produktname</label>

  <input
    id="neuProdukt"
    type="text"
    placeholder="z. B. Gehackte Tomaten">


  <label>Marke</label>

  <input
    id="neuMarke"
    type="text"
    placeholder="optional">


  <label>Kategorie</label>

  <select id="neuKategorie">

    <option>Konserven</option>
    <option>Soßen</option>
    <option>Gläser</option>
    <option>Nudeln & Reis</option>
    <option>Backen</option>
    <option>Gewürze</option>
    <option>Getränke</option>
    <option>Sonstiges</option>

  </select>


  <label>Einheit</label>

  <select id="neuEinheit">

    <option>Stück</option>
    <option>Dose</option>
    <option>Glas</option>
    <option>Flasche</option>
    <option>Packung</option>

  </select>


  <label>Standort</label>

  <select id="neuStandort">

    <option>Vorratsschrank</option>
    <option>Kühlschrank</option>
    <option>Gefrierschrank</option>
    <option>Regal</option>
    <option>Keller</option>
    <option>Sonstiges</option>

  </select>


  <label>Mindestbestand</label>

  <input
    id="neuMindestbestand"
    type="number"
    value="1"
    min="0">


  <button
    class="speichern"
    onclick="produktSpeichern()">

    💾 Speichern & +1 einlagern

  </button>

</div>


<div id="meldung"></div>
  
<div class="box">

  <h2>📦 Mein Bestand</h2>

  <button onclick="bestandLaden()">
    🔄 Bestand anzeigen
  </button>

  <div id="bestandsListe"></div>

</div>


<div class="box">

  <h2>🛒 Einkaufsliste</h2>

  <button onclick="einkaufslisteLaden()">
    🔄 Einkaufsliste anzeigen
  </button>

  <div id="einkaufsListe"></div>

</div>


<script>


// ========================================
// HIER DEINE APPS-SCRIPT-URL EINTRAGEN
// ========================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyuxJgOWFwuNFlNAHELJvqEg55Y8uHMM99_AQUi5n8QxP5aDCgDbqqURIgwSueDjbgI/exec";


// ========================================


let aktuellerBarcode = "";

let letzterScan = "";

let letzterScanZeitpunkt = 0;

let buchungLaeuft = false;



// ---------- JSONP ----------

function jsonp(parameter, callback) {

  const callbackName =
    "cb_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);


  const script =
    document.createElement("script");


  window[callbackName] =
    function(daten) {

      callback(daten);

      delete window[callbackName];

      script.remove();
    };


  script.src =
    API_URL +
    "?" +
    parameter +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      document.getElementById("meldung")
        .innerText =
        "❌ Verbindung zum Inventar fehlgeschlagen.";

      delete window[callbackName];

      script.remove();
    };


  document.body.appendChild(script);
}



// ---------- SCAN ----------

function barcodeGefunden(decodedText) {

  const jetzt = Date.now();


  if (
    decodedText === letzterScan &&
    jetzt - letzterScanZeitpunkt < 3000
  ) {
    return;
  }


  letzterScan = decodedText;

  letzterScanZeitpunkt = jetzt;

  aktuellerBarcode = decodedText;


  document.getElementById("produktBox")
    .style.display = "none";

  document.getElementById("neuBox")
    .style.display = "none";


  document.getElementById("meldung")
    .innerText =
    "🔎 Produkt wird gesucht …";


  jsonp(

    "action=produkt&barcode=" +
    encodeURIComponent(decodedText),

    produktAnzeigen

  );

}



// ---------- PRODUKT ANZEIGEN ----------

function produktAnzeigen(daten) {

  if (daten.gefunden) {

    document.getElementById("neuBox")
      .style.display = "none";


    document.getElementById("produktBox")
      .style.display = "block";


    document.getElementById("produktName")
      .innerText =
      daten.produkt;


    document.getElementById("details")
      .innerText =
      (daten.marke || "") +
      "\n📦 " +
      (daten.kategorie || "") +
      "\n📍 " +
      (daten.standort || "");


    document.getElementById("bestand")
      .innerText =
      daten.bestand;


    document.getElementById("meldung")
      .innerText =
      "✅ Produkt erkannt";


  } else {


    document.getElementById("produktBox")
      .style.display = "none";


    document.getElementById("neuBox")
      .style.display = "block";


    document.getElementById("neuerBarcode")
      .innerText =
      aktuellerBarcode;


    document.getElementById("neuProdukt")
      .value = "";


    document.getElementById("neuMarke")
      .value = "";


    document.getElementById("meldung")
      .innerText =
      "❓ Dieses Produkt kennen wir noch nicht.";

  }

}



// ---------- BESTAND BUCHEN ----------

function buchen(typ) {

  if (!aktuellerBarcode || buchungLaeuft) {
    return;
  }


  buchungLaeuft = true;


  document.getElementById("meldung")
    .innerText =
    "⏳ Wird gespeichert …";


  jsonp(

    "action=buchen" +
    "&barcode=" +
    encodeURIComponent(aktuellerBarcode) +
    "&typ=" +
    encodeURIComponent(typ),

    function(daten) {

      buchungLaeuft = false;


      if (daten.erfolg) {

        document.getElementById("bestand")
          .innerText =
          daten.bestand;


        document.getElementById("meldung")
          .innerText =
          typ === "plus"
          ? "✅ 1 eingelagert"
          : "✅ 1 entnommen";


      } else {

        document.getElementById("meldung")
          .innerText =
          "❌ " +
          (daten.fehler || "Fehler");

      }

    }

  );

}



// ---------- NEUES PRODUKT ----------

function produktSpeichern() {

  const produkt =
    document.getElementById("neuProdukt")
      .value.trim();


  if (!produkt) {

    document.getElementById("meldung")
      .innerText =
      "Bitte einen Produktnamen eingeben.";

    return;
  }


  const marke =
    document.getElementById("neuMarke")
      .value.trim();


  const kategorie =
    document.getElementById("neuKategorie")
      .value;


  const einheit =
    document.getElementById("neuEinheit")
      .value;


  const standort =
    document.getElementById("neuStandort")
      .value;


  const mindestbestand =
    document.getElementById("neuMindestbestand")
      .value;


  document.getElementById("meldung")
    .innerText =
    "⏳ Produkt wird angelegt …";


  jsonp(

    "action=anlegen" +

    "&barcode=" +
    encodeURIComponent(aktuellerBarcode) +

    "&produkt=" +
    encodeURIComponent(produkt) +

    "&marke=" +
    encodeURIComponent(marke) +

    "&kategorie=" +
    encodeURIComponent(kategorie) +

    "&einheit=" +
    encodeURIComponent(einheit) +

    "&standort=" +
    encodeURIComponent(standort) +

    "&mindestbestand=" +
    encodeURIComponent(mindestbestand),


    function(daten) {


      if (daten.erfolg) {

        document.getElementById("neuBox")
          .style.display =
          "none";


        document.getElementById("produktBox")
          .style.display =
          "block";


        document.getElementById("produktName")
          .innerText =
          produkt;


        document.getElementById("details")
          .innerText =
          (marke || "") +
          "\n📦 " +
          kategorie +
          "\n📍 " +
          standort;


        document.getElementById("bestand")
          .innerText =
          daten.bestand;


        document.getElementById("meldung")
          .innerText =
          "✅ Produkt gespeichert und eingelagert";


      } else {


        document.getElementById("meldung")
          .innerText =
          "❌ " +
          (daten.fehler || "Fehler");


      }

    }

  );

}



// ---------- SCANNER ----------
function bestandLaden() {

  const ziel =
    document.getElementById("bestandsListe");

  ziel.innerHTML =
    "<p>⏳ Bestand wird geladen …</p>";


  jsonp(
    "action=bestand",

    function(daten) {

      if (!daten.erfolg) {

        ziel.innerHTML =
          "<p>❌ Bestand konnte nicht geladen werden.</p>";

        return;
      }


      if (daten.produkte.length === 0) {

        ziel.innerHTML =
          "<p>Noch keine Produkte vorhanden.</p>";

        return;
      }


      let html = "";


      daten.produkte.forEach(p => {

        html += `
          <div style="
            padding:12px 0;
            border-bottom:1px solid #ddd;
          ">

            <strong>
              ${p.produkt}
            </strong>

            ${p.marke
              ? "<br><small>" + p.marke + "</small>"
              : ""
            }

            <br>

            📦 Bestand:
            <strong>${p.bestand}</strong>
            ${p.einheit || ""}

            <br>

            📍 ${p.standort || "–"}

          </div>
        `;

      });


      ziel.innerHTML = html;

    }
  );
}



function einkaufslisteLaden() {

  const ziel =
    document.getElementById("einkaufsListe");

  ziel.innerHTML =
    "<p>⏳ Einkaufsliste wird geladen …</p>";


  jsonp(
    "action=bestand",

    function(daten) {

      if (!daten.erfolg) {

        ziel.innerHTML =
          "<p>❌ Einkaufsliste konnte nicht geladen werden.</p>";

        return;
      }


      const einkaufen =
        daten.produkte.filter(
          p => p.einkaufen
        );


      if (einkaufen.length === 0) {

        ziel.innerHTML =
          "<p>✅ Aktuell musst du nichts nachkaufen.</p>";

        return;
      }


      let html = "";


      einkaufen.forEach(p => {

        const fehlend =
          Math.max(
            1,
            p.mindestbestand - p.bestand + 1
          );


        html += `
          <div style="
            padding:12px 0;
            border-bottom:1px solid #ddd;
          ">

            <strong>
              🛒 ${p.produkt}
            </strong>

            <br>

            Bestand:
            ${p.bestand}

            <br>

            Mindestbestand:
            ${p.mindestbestand}

            <br>

            <strong>
              Empfehlung: ${fehlend} nachkaufen
            </strong>

          </div>
        `;

      });


      ziel.innerHTML = html;

    }
  );
}
const scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 10,

      qrbox: {
        width: 280,
        height: 140
      },

      rememberLastUsedCamera: true

    },

    false

  );


scanner.render(barcodeGefunden);


</script>


</body>

</html>
